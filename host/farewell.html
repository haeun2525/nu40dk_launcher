<!doctype html>
<meta charset="utf-8">
<title>farewell</title>
<!--
  Clock out screen. launcher.py shows it full screen in Chrome app mode (--app).
  App mode has no tabs and no address bar, and the page closes itself when done.

  It was first built with tkinter and dropped. This Mac's Tk created the window but
  couldn't draw the canvas, leaving only a white screen (stuck in root.update()).

  The text comes in as ?msg=... (and ?sub=...). To preview it, just open the file in a browser.
  Korean or any other text works too: the font stack includes Apple SD Gothic Neo.
-->
<style>
  :root { --bg: #0d0d14; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }

  .center {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    text-align: center; pointer-events: none;
  }
  /* Confetti also passes behind the text, which gives the screen depth */
  .center { z-index: 2; }
  canvas { position: fixed; inset: 0; z-index: 1; }

  h1 {
    margin: 0; font-size: 7.5vw; font-weight: 800; color: #fff;
    letter-spacing: -0.02em;
    animation: rise 700ms cubic-bezier(.2,.9,.25,1) both;
  }
  p {
    margin: 2.2vh 0 0; font-size: 2.2vw; color: #9aa0b5;
    animation: rise 700ms cubic-bezier(.2,.9,.25,1) 180ms both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(28px) scale(.94); }
    to   { opacity: 1; transform: none; }
  }

  /* At the end, fade the whole screen to dark */
  #fade {
    position: fixed; inset: 0; z-index: 3; background: var(--bg);
    opacity: 0; pointer-events: none; transition: opacity 900ms ease-in;
  }
  #fade.on { opacity: 1; }
</style>

<canvas id="c"></canvas>
<div class="center">
  <h1 id="msg">See you!</h1>
  <p id="sub">Great work today</p>
</div>
<div id="fade"></div>

<script>
  const DURATION   = 4600;   // total length
  const FADE_MS    = 900;    // final fade to dark
  const SPAWN_MS   = 1400;   // keep spawning for this long
  const SPAWN_RATE = 6;      // pieces per frame
  const MAX_PIECES = 520;
  const COLORS = ["#ff5a7a","#ffd166","#06d6a0","#5aa9ff","#c77dff","#ff9f68","#ffffff"];

  const params = new URLSearchParams(location.search);
  if (params.get("msg")) document.getElementById("msg").textContent = params.get("msg");
  if (params.get("sub")) document.getElementById("sub").textContent = params.get("sub");

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W, H, dpr;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = canvas.width  = innerWidth  * dpr;
    H = canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener("resize", resize);

  const rand = (a, b) => a + Math.random() * (b - a);

  class Piece {
    constructor() {
      this.x = rand(-40, innerWidth + 40);
      this.y = rand(-innerHeight * 0.5, -20);
      this.vx = rand(-1.1, 1.1);
      this.vy = rand(2.2, 6.5);
      // Big pieces show up on video. Small ones look like dust
      this.w = rand(13, 27);
      this.h = rand(17, 36);
      this.spin = rand(0.08, 0.22);
      this.phase = rand(0, Math.PI * 2);
      this.sway = rand(0.4, 1.4);
      this.color = COLORS[(Math.random() * COLORS.length) | 0];
    }
    step() {
      this.phase += this.spin;
      this.vy += 0.045;                       // gravity
      this.x += this.vx + Math.sin(this.phase) * this.sway;
      this.y += this.vy;
    }
    draw() {
      // Squash and stretch the width to fake rotation
      const w = this.w * Math.abs(Math.cos(this.phase));
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x - w / 2, this.y - this.h / 2, w, this.h);
    }
  }

  const pieces = [];
  const start = performance.now();

  function frame(now) {
    const t = now - start;
    ctx.clearRect(0, 0, innerWidth, innerHeight);

    if (t < SPAWN_MS && pieces.length < MAX_PIECES) {
      for (let i = 0; i < SPAWN_RATE; i++) pieces.push(new Piece());
    }

    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      p.step();
      if (p.y - p.h > innerHeight) { pieces.splice(i, 1); continue; }
      p.draw();
    }

    if (t < DURATION) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setTimeout(() => document.getElementById("fade").classList.add("on"),
             DURATION - FADE_MS);

  // An app-mode window can close itself. A window left behind after Clock out makes no sense
  setTimeout(() => window.close(), DURATION + 250);

  // If you change your mind while filming, you can close it right away
  addEventListener("keydown", (e) => { if (e.key === "Escape") window.close(); });
  addEventListener("click", () => window.close());
</script>
